name: variables
on: 
  workflow_dispatch: 
   inputs:
    environment:
     description: Select environment
     required: true
     default: dev
     type: choice
     options:
       - dev
       - test
       - UAT
jobs:
  job1:
    env:
     MY_NAME: "prabhas"
    runs-on: ubuntu-latest
    steps:
      - name: "env variables"
        run: |
         echo " my name is $MY_NAME"
         pwd
         hostname
  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: " printing name"
        run: |
          echo " print ${{github.ref.name}}
          echo " this workflow is run by ${{github.actor_id}}
          pwd
      
      
